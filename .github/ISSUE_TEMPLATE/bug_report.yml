  - type: input
    id: ha_version
    attributes:
      label: Home Assistant Core Version
      description: Your version of Home Assistant Core.
      placeholder: e.g., HA 2026.9.1
    validations:
      required: true

  - type: dropdown
    id: connection_type
    attributes:
      label: Bluetooth Connection Type
      description: How is Home Assistant connected to your Petkit fountain?
      options:
        - Local Bluetooth Adapter (built-in / USB dongle)
        - ESPHome Bluetooth Proxy
        - Unsure / Multiple
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs & Debug Snippets
      description: |
        Please enable debug logging in integration options or add `custom_components.petkit_ble: debug` to your `configuration.yaml` and paste relevant logs here.
      placeholder: Paste logs or petkit.log contents here...
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any other context or screenshots about the problem here.
    validations:
      required: false
