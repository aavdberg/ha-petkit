name: Update version dropdown

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-version-dropdown
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Refresh integration-version options
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/update_version_dropdown.py

      - name: Commit if changed
        run: |
          if git diff --quiet .github/ISSUE_TEMPLATE/bug_report.yml; then
            echo "No change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ISSUE_TEMPLATE/bug_report.yml
          git commit -m "chore(ci): refresh issue-form version dropdown [skip ci]"
          git push
